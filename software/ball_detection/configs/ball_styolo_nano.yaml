project:
  name: ball_detector

paths:
  dataset_root: ../../../datasets/BALL
  images_dir: ../../../datasets/BALL
  annotations_csv: null
  output_dir: ball_detection/runs
  export_dir: ball_detection/exports
  splits_dir: ball_detection/splits

dataset:
  class_name: Ball
  bbox_format: xywh_topleft   # fallback when no dataset.sources are provided
  duplicate_policy: append    # fallback when no dataset.sources are provided
  sources:
    - name: spl
      images_dir: SPLDataset
      annotation_file: annotations.csv
      annotation_format: csv_xywh_topleft
      bbox_format: xywh_topleft
      duplicate_policy: append
    - name: our
      images_dir: OurDataset
      annotation_file: annotations.csv
      annotation_format: csv_xywh_topleft
      bbox_format: xywh_topleft
      duplicate_policy: append
  train_val_split: 0.8
  reuse_splits: true          # reuse split files from ball_detection/splits if valid
  mix_sources_per_batch: true
  seed: 42

input:                        # image resolution
  width: 640
  height: 480
  color_mode: rgb
  channels: 3
  resize_policy: resize      # resize (direct warp) | letterbox (keep aspect + pad)
  interpolation: bilinear
  letterbox_fill_value: 114  # used only when resize_policy=letterbox

model:
  name: ball_styolo_nano
  num_classes: 1            # ball
  strides: [8, 16, 32]
  width_mult: 0.75
  neck_out_ch: 96

train:
  epochs: 100
  batch_size: 32 # reverted -- 64 doubled per-batch CPU loss-assignment work and stalled epoch 1
  num_workers: 4 # known-good from runs/20260516-022816 (5.4 min/epoch)
  optimizer: adamw
  optimizer_params:
    betas: [0.9, 0.999]
    eps: 1.0e-8
    momentum: 0.9      # used for SGD
    nesterov: true     # used for SGD
  scheduler: cosine
  scheduler_params:
    t_max: 100         # keep cosine schedule aligned with train.epochs
    eta_min: 1.0e-5    # prev run flatlined after epoch ~30 because LR -> 0; floor at 1e-5 keeps late epochs alive
    factor: 0.5        # used for plateau
    patience: 5        # used for plateau
    threshold: 1.0e-4  # used for plateau
    min_lr: 0.0        # used for plateau
    cooldown: 0        # used for plateau
  lr: 0.001
  weight_decay: 0.0001 # was 0.0005
  amp: true
  grad_clip_norm: 10.0
  early_stopping:
    enabled: true
    monitor: val_map50    # val_map5095 was too noisy (single-epoch flukes triggered bad_epochs)
    mode: max
    patience: 30
    min_delta: 0.001      # was 0.0003 -- noise floor on val_map50 across epochs is ~0.005-0.01
  preview_train_inputs: false       # save a few post-augmentation training images each epoch
  train_input_preview_max: 5       # how many train-input previews per epoch

loss:
  obj_weight: 1.0
  box_weight: 5.0
  obj_loss_mode: mean
  obj_pos_weight: 1.0
  obj_neg_weight: 1.0
  obj_bce_pos_weight: 8.0  # 20 was too eager (P=0.25, fp/img=2.13). 8 keeps obj_loss alive but less trigger-happy
  focal_loss: true
  focal_alpha: 0.25
  focal_gamma: 2.0
  assign_scale_target: 2.0 # 3.0 over-assigned at scale boundaries; 2.0 keeps coverage with fewer ghost positives
  assign_conflict_policy: largest_area   # largest_area | last
  assign_center_radius: 1 # 3x3 positive region around the ball center for more positives
  decode_twth_clamp_min: -4.0
  decode_twth_clamp_max: 4.0
  box_loss_type: diou       # iou (pure 1-IoU) | diou (1-IoU + center-distance penalty)

eval:
  conf_threshold: 0.60 # picked from epoch_019 sweep on runs/20260516-192555-spl_our_v4_sweep_fixed (F1=0.664)
  nms_iou_threshold: 0.25
  max_detections: 3
  use_nms: true
  single_object_mode: false
  ap_conf_threshold: 0.001
  ap_max_detections: 200
  ap_use_nms: true
  matching_iou_threshold: 0.5
  small_area_threshold: 0.005
  medium_area_threshold: 0.03
  iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  threshold_sweep:        # sweep of conf_threshold to find best operating point
    enabled: false        # per-epoch sweep OFF (was ~1-3 min of CPU work per validation)
    run_at_end: true      # dataset changed (~165 imgs + pip_natLight_ball_2 folder removed); rerun final sweep to recalibrate conf_threshold
    every_n_epochs: 1
    start: 0.05
    end: 0.95
    step: 0.05
    objective: f1
    save_csv: true

export:
  opset: 13
  dynamic_batch: false
  do_fp32_onnx: true
  do_int8_ptq_qdq: true
  calibration_batches: 20
  int8:
    per_channel: true
    activation_type: int8
    weight_type: int8
    calibrate_method: minmax

augmentation:
  horizontal_flip: true
  hflip_prob: 0.5
  color_jitter: true
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  blur: true # was false
  blur_prob: 0.15 # was 0.2
  blur_radius: 0.8
