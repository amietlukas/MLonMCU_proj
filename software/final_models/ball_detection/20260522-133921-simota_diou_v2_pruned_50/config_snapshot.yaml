project:
  name: ball_detector
paths:
  dataset_root: /mnt/core/MLonMCU_proj/datasets/BALL
  images_dir: /mnt/core/MLonMCU_proj/datasets/BALL
  annotations_csv: null
  output_dir: /mnt/core/MLonMCU_proj/software/ball_detection/runs
  export_dir: /mnt/core/MLonMCU_proj/software/ball_detection/configs/ball_detection/exports
  splits_dir: /mnt/core/MLonMCU_proj/software/ball_detection/splits
dataset:
  class_name: Ball
  bbox_format: xywh_topleft
  duplicate_policy: append
  sources:
  - name: spl
    images_dir: SPLDataset
    annotation_file: annotations.csv
    annotation_format: csv_xywh_topleft
    bbox_format: xywh_topleft
    duplicate_policy: append
  - name: our
    images_dir: OurDataset
    annotation_file: annotations.csv
    annotation_format: csv_xywh_topleft
    bbox_format: xywh_topleft
    duplicate_policy: append
  train_val_split: 0.8
  reuse_splits: true
  mix_sources_per_batch: true
  validate_images: true
  skip_unreadable_images: true
  read_retry_count: 8
  seed: 42
input:
  width: 640
  height: 480
  color_mode: rgb
  channels: 3
  resize_policy: resize
  interpolation: bilinear
  letterbox_fill_value: 114
model:
  name: ball_styolo_nano
  num_classes: 1
  strides:
  - 8
  - 16
  - 32
  width_mult: 1.0
  neck_out_ch: 96
train:
  epochs: 150
  batch_size: 32
  num_workers: 4
  optimizer: adamw
  optimizer_params:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    momentum: 0.9
    nesterov: true
  scheduler: cosine
  scheduler_params:
    t_max: 150
    eta_min: 1.0e-06
    factor: 0.5
    patience: 5
    threshold: 0.0001
    min_lr: 0.0
    cooldown: 0
  lr: 0.001
  weight_decay: 0.0001
  amp: true
  grad_clip_norm: 10.0
  early_stopping:
    enabled: true
    monitor: val_map5095
    mode: max
    patience: 30
    min_delta: 0.0003
  preview_train_inputs: false
  train_input_preview_max: 5
loss:
  obj_weight: 1.0
  box_weight: 5.0
  obj_loss_mode: mean
  obj_pos_weight: 1.0
  obj_neg_weight: 1.0
  obj_bce_pos_weight: 1.0
  focal_loss: true
  focal_alpha: 0.25
  focal_gamma: 2.0
  assign_scale_target: 1.5
  assign_conflict_policy: largest_area
  assign_center_radius: 1
  decode_twth_clamp_min: -4.0
  decode_twth_clamp_max: 4.0
  box_loss_type: diou
assigner:
  type: simota_lite
  simota:
    center_radius: 2.5
    topk_iou: 10
    min_k: 1
    max_k: 5
    iou_weight: 3.0
    obj_weight: 1.0
    center_weight: 0.5
    iou_cost_type: neg_log_iou
    eps: 1.0e-08
    debug: true
    debug_every_n_batches: 20
eval:
  conf_threshold: 0.5
  nms_iou_threshold: 0.25
  max_detections: 3
  use_nms: true
  single_object_mode: false
  ap_conf_threshold: 0.001
  ap_max_detections: 200
  ap_use_nms: true
  matching_iou_threshold: 0.5
  small_area_threshold: 0.005
  medium_area_threshold: 0.03
  iou_thresholds:
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
export:
  opset: 13
  dynamic_batch: false
  do_fp32_onnx: true
  do_int8_ptq_qdq: true
  calibration_batches: 20
  int8:
    per_channel: true
    activation_type: uint8
    weight_type: int8
    calibrate_method: minmax
augmentation:
  horizontal_flip: true
  hflip_prob: 0.5
  color_jitter: true
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  blur: true
  blur_prob: 0.15
  blur_radius: 0.8
_meta:
  config_path: /mnt/core/MLonMCU_proj/software/ball_detection/configs/ball_styolo_nano_simota.yaml
  project_root: /mnt/core/MLonMCU_proj/software/ball_detection
  software_root: /mnt/core/MLonMCU_proj/software
  repo_root: /mnt/core/MLonMCU_proj
